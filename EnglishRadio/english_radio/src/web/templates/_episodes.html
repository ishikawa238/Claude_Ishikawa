{# 再生リストのエピソード一覧（today / history_detail 共通） #}
{% for e in items %}
<div class="episode">
  <div class="pos">{{ loop.index }}</div>
  <div class="body">
    <div>
      {% if e.source == 'new' %}<span class="badge new">🆕 新着</span>{% else %}<span class="badge shuffle">🔀 ライブラリから</span>{% endif %}
      <span class="muted">{{ e.show }}</span>
    </div>
    <div class="ttl">{{ e.title }}</div>
    <div class="muted">{{ e.duration_sec | minutes }} ・ 配信 {{ (e.published or '')[:10] }} ・ {{ e.play_count }}回再生</div>
  </div>
  <button class="btn small" data-post="/api/play/episode" data-body='{{ {"guid": e.guid} | tojson }}'>▶</button>
</div>
{% endfor %}
