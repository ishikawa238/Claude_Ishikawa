{% extends "base.html" %}
{% block title %}Settings{% endblock %}

{% block content %}
<h1 class="h4 mb-4">Settings</h1>

<div id="settingsAlert" style="display:none" class="alert mb-4" role="alert"></div>

<div id="settingsContainer">
  <div class="text-center py-4 text-muted">読み込み中...</div>
</div>

<div class="mt-4 d-flex gap-2">
  <button id="saveBtn" class="btn btn-primary" onclick="saveSettings()" disabled>
    保存
  </button>
  <button id="resetBtn" class="btn btn-outline-secondary" onclick="resetToDefault()" disabled>
    デフォルトに戻す
  </button>
  <span id="saveStatus" class="align-self-center text-muted" style="font-size:0.85rem"></span>
</div>

<div class="mt-3 meta-medium text-muted-custom">
  設定変更は即座にメモリに反映されます。次回のバッチ実行から新しい設定が使われます。
</div>
{% endblock %}

{% block scripts %}
<script>
let _settings = [];
let _groupLabels = {};
let _originalValues = {};

async function loadSettings() {
  try {
    const resp = await fetch('/api/settings');
    const data = await resp.json();
    _settings = data.settings;
    _groupLabels = data.group_labels;
    _originalValues = {};
    _settings.forEach(s => { _originalValues[s.section + '.' + s.key] = s.value; });
    renderForm();
    document.getElementById('saveBtn').disabled = false;
    document.getElementById('resetBtn').disabled = false;
  } catch (e) {
    document.getElementById('settingsContainer').innerHTML =
      '<div class="alert alert-danger">設定の読み込みに失敗しました</div>';
  }
}

function renderForm() {
  const container = document.getElementById('settingsContainer');
  const groups = {};
  _settings.forEach(s => {
    if (!groups[s.group]) groups[s.group] = [];
    groups[s.group].push(s);
  });

  let html = '';
  for (const [groupKey, items] of Object.entries(groups)) {
    const label = _groupLabels[groupKey] || groupKey;
    html += `<div class="section">`;
    html += `<h2>${esc(label)}</h2>`;
    html += `<div class="summary-card"><div class="row g-3">`;

    for (const s of items) {
      const id = s.section + '.' + s.key;
      const helpHtml = s.help ? `<div class="form-text">${esc(s.help)}</div>` : '';

      if (s.type === 'bool') {
        html += `
          <div class="col-12 col-md-6">
            <div class="form-check form-switch py-2">
              <input class="form-check-input" type="checkbox" id="${id}"
                     ${s.value ? 'checked' : ''} onchange="markDirty()">
              <label class="form-check-label fw-bold" for="${id}">${esc(s.label)}</label>
            </div>
            ${helpHtml}
          </div>`;
      } else {
        const step = s.step || (s.type === 'float' ? 0.01 : 1);
        html += `
          <div class="col-12 col-md-6 col-lg-4">
            <label class="form-label fw-bold" for="${id}">${esc(s.label)}</label>
            <input type="number" class="form-control" id="${id}"
                   value="${s.value}" step="${step}"
                   ${s.min !== null ? 'min="' + s.min + '"' : ''}
                   ${s.max !== null ? 'max="' + s.max + '"' : ''}
                   onchange="markDirty()">
            ${helpHtml}
          </div>`;
      }
    }
    html += `</div></div></div>`;
  }
  container.innerHTML = html;
}

function markDirty() {
  document.getElementById('saveStatus').textContent = '未保存の変更があります';
  document.getElementById('saveBtn').classList.remove('btn-primary');
  document.getElementById('saveBtn').classList.add('btn-warning');
}

async function saveSettings() {
  const btn = document.getElementById('saveBtn');
  const status = document.getElementById('saveStatus');
  btn.disabled = true;
  status.textContent = '保存中...';

  const updates = {};
  _settings.forEach(s => {
    const id = s.section + '.' + s.key;
    const el = document.getElementById(id);
    if (!el) return;
    if (s.type === 'bool') {
      updates[id] = el.checked;
    } else if (s.type === 'int') {
      updates[id] = parseInt(el.value, 10);
    } else {
      updates[id] = parseFloat(el.value);
    }
  });

  try {
    const resp = await fetch('/api/settings', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({settings: updates}),
    });
    const data = await resp.json();

    const alertEl = document.getElementById('settingsAlert');
    if (data.success) {
      alertEl.className = 'alert alert-success mb-4';
      alertEl.textContent = `${data.updated} 項目を保存しました`;
      alertEl.style.display = 'block';
      status.textContent = '';
      btn.classList.remove('btn-warning');
      btn.classList.add('btn-primary');
      // 保存後に最新値を再取得
      await loadSettings();
    } else {
      let msg = data.error || '保存に失敗しました';
      if (data.details) msg += '\n' + data.details.join('\n');
      alertEl.className = 'alert alert-danger mb-4';
      alertEl.textContent = msg;
      alertEl.style.display = 'block';
      status.textContent = '';
    }
  } catch (e) {
    document.getElementById('settingsAlert').className = 'alert alert-danger mb-4';
    document.getElementById('settingsAlert').textContent = '通信エラー: ' + e.message;
    document.getElementById('settingsAlert').style.display = 'block';
    status.textContent = '';
  }
  btn.disabled = false;

  setTimeout(() => {
    document.getElementById('settingsAlert').style.display = 'none';
  }, 5000);
}

function resetToDefault() {
  if (!confirm('すべての設定をデフォルト値に戻しますか？')) return;
  _settings.forEach(s => {
    const id = s.section + '.' + s.key;
    const el = document.getElementById(id);
    if (!el) return;
    if (s.type === 'bool') {
      el.checked = s.default;
    } else {
      el.value = s.default;
    }
  });
  markDirty();
}

function esc(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

loadSettings();
</script>
{% endblock %}
