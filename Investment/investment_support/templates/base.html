<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Investment Dashboard{% endblock %}</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Vendor -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0"></script>

<!-- Icons -->
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

<!-- App -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
<script src="{{ url_for('static', filename='js/chart-theme.js') }}"></script>
{% block head_extra %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-expand-sm mb-4 px-3">
  <a class="navbar-brand" href="/report">
    <i data-lucide="line-chart" style="width:20px;height:20px;margin-right:6px;vertical-align:-3px"></i>Investment
  </a>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
          aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navMenu">
    <div class="navbar-nav ms-auto gap-1">
      <a class="nav-link {{ 'active' if active_page == 'report' }}" href="/report">
        <i data-lucide="layout-dashboard" style="width:16px;height:16px;vertical-align:-2px;margin-right:4px"></i>Dashboard
      </a>
      <a class="nav-link {{ 'active' if active_page == 'rules' }}" href="/rules">
        <i data-lucide="shield-check" style="width:16px;height:16px;vertical-align:-2px;margin-right:4px"></i>Rules
      </a>
      <a class="nav-link {{ 'active' if active_page == 'scoring' }}" href="/scoring">
        <i data-lucide="gauge" style="width:16px;height:16px;vertical-align:-2px;margin-right:4px"></i>Scoring
      </a>
      <a class="nav-link {{ 'active' if active_page == 'screening' }}" href="/screening">
        <i data-lucide="filter" style="width:16px;height:16px;vertical-align:-2px;margin-right:4px"></i>Screening
      </a>
      <a class="nav-link {{ 'active' if active_page == 'performance' }}" href="/performance">
        <i data-lucide="bar-chart-3" style="width:16px;height:16px;vertical-align:-2px;margin-right:4px"></i>Performance
      </a>
      <a class="nav-link {{ 'active' if active_page == 'paypay' }}" href="/paypay">
        <i data-lucide="coins" style="width:16px;height:16px;vertical-align:-2px;margin-right:4px"></i>PayPay
      </a>
      <a class="nav-link {{ 'active' if active_page == 'prompt_builder' }}" href="/prompt-builder">
        <i data-lucide="message-square-text" style="width:16px;height:16px;vertical-align:-2px;margin-right:4px"></i>Prompt
      </a>
      <a class="nav-link {{ 'active' if active_page == 'settings' }}" href="/settings">
        <i data-lucide="settings" style="width:16px;height:16px;vertical-align:-2px;margin-right:4px"></i>Settings
      </a>
      <button id="themeToggle" class="theme-toggle ms-2" onclick="toggleTheme()" title="テーマ切替">
        <i data-lucide="moon" style="width:16px;height:16px"></i>
      </button>
    </div>
  </div>
</nav>

<!-- System Health Bar -->
<div id="healthBar" class="px-3 mb-3" style="display:none !important;font-size:var(--text-xs);color:var(--text-muted)">
  <div class="d-flex align-items-center gap-3 flex-wrap">
    <span id="healthBatch"></span>
    <span id="healthData"></span>
    <span id="healthErrors"></span>
  </div>
  <ul id="healthErrorDetails" class="health-error-list mb-0 mt-1 ps-3" style="display:none"></ul>
</div>

{% block content %}{% endblock %}

<!-- Bootstrap JS for navbar toggle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

{% block scripts %}{% endblock %}

<script>
lucide.createIcons();
// System Health Bar
(function() {
  fetch('/api/system-health').then(function(r) { return r.json(); }).then(function(d) {
    var bar = document.getElementById('healthBar');
    if (!bar) return;
    bar.style.display = '';
    bar.style.setProperty('display', 'flex', 'important');

    var batchEl = document.getElementById('healthBatch');
    if (batchEl && d.last_batch) {
      var status = d.last_batch.status === 'success' ? '●' : '▲';
      var dotCls = d.last_batch.status === 'success' ? 'color:var(--color-success)' : 'color:var(--color-warning)';
      var timeStr = d.last_batch.time || '';
      // 相対時間
      if (timeStr) {
        try {
          var diffMs = Date.now() - new Date(timeStr.replace(' ', 'T')).getTime();
          var diffH = Math.floor(diffMs / 3600000);
          var diffM = Math.floor((diffMs % 3600000) / 60000);
          timeStr = diffH > 0 ? diffH + 'h' + diffM + 'm前' : diffM + 'm前';
        } catch(e) {}
      }
      batchEl.innerHTML = '<span style="' + dotCls + '">' + status + '</span> ' + d.last_batch.type + ' ' + timeStr;
    }

    var dataEl = document.getElementById('healthData');
    if (dataEl && d.data_date) {
      dataEl.textContent = 'データ: ' + d.data_date;
    }

    function escHtml(s) {
      var el = document.createElement('span');
      el.textContent = s || '';
      return el.innerHTML;
    }

    var errEl = document.getElementById('healthErrors');
    var errDetails = document.getElementById('healthErrorDetails');
    if (errEl && d.errors_24h > 0) {
      errEl.innerHTML = '<button type="button" id="healthErrorsToggle" class="btn btn-link p-0 border-0 align-baseline" style="font-size:inherit;color:var(--color-danger);text-decoration:none">● エラー ' + d.errors_24h + '件(24h) ▾</button>';
      if (errDetails && d.recent_errors && d.recent_errors.length) {
        errDetails.innerHTML = d.recent_errors.map(function(e) {
          var fatal = e.fatal ? ' <span style="color:var(--color-danger)">[致命的]</span>' : '';
          var head = escHtml(e.time) + ' · ' + escHtml(e.batch) + ' · ' + escHtml(e.type) + fatal;
          var body = escHtml(e.message).replace(/\n/g, '<br>');
          return '<li class="mb-1"><strong>' + head + '</strong><br><span style="opacity:0.9">' + body + '</span></li>';
        }).join('');
        var toggle = document.getElementById('healthErrorsToggle');
        if (toggle) {
          toggle.addEventListener('click', function() {
            var open = errDetails.style.display !== 'none';
            errDetails.style.display = open ? 'none' : 'block';
            toggle.textContent = toggle.textContent.replace(open ? '▴' : '▾', open ? '▾' : '▴');
          });
        }
      }
    }
  }).catch(function() {});
})();
</script>
</body>
</html>
