<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Investment Dashboard{% endblock %}</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% block head_extra %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-expand-sm navbar-light bg-white mb-4 rounded shadow-sm px-3">
  <a class="navbar-brand fw-bold" href="/report">Investment Dashboard</a>
  <div class="navbar-nav ms-auto">
    <a class="nav-link {{ 'active' if active_page == 'report' }}" href="/report">Dashboard</a>
    <a class="nav-link {{ 'active' if active_page == 'screening' }}" href="/screening">Screening</a>
    <a class="nav-link {{ 'active' if active_page == 'performance' }}" href="/performance">Performance</a>
  </div>
</nav>

{% block content %}{% endblock %}

{% block scripts %}{% endblock %}

</body>
</html>
